<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{box-sizing:border-box} :root{--bg:#f7f5f0;--rail:#f0ede6;--paper:#fffdf8;--ink:#1f2420;--muted:#73776f;--line:#e4ded3;--green:#176b5d;--green-dark:#0f5147;--danger:#b45309;--ok:#16803d;--shadow:0 18px 48px rgba(45,38,26,.08)}
body{margin:0;height:100dvh;display:grid;grid-template-columns:292px minmax(520px,1fr) 330px;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif}
body.inspector-collapsed{grid-template-columns:292px minmax(520px,1fr) 0}body.inspector-collapsed .inspector{display:none}
button,input,textarea,select{font:inherit}button{min-height:34px;border:1px solid var(--line);background:#fffaf2;color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer}button:hover{border-color:var(--green);color:var(--green-dark);background:#fff}button.primary{background:var(--green);border-color:var(--green);color:#fff}button.primary:hover{background:var(--green-dark);color:#fff}button.danger:hover{border-color:var(--danger);color:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fffdf8;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:3px solid rgba(23,107,93,.12);border-color:var(--green)}label{color:var(--muted);font-size:12px;display:grid;gap:6px}
.sidebar{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.brand{padding:20px 16px 16px}.brand h1{margin:0 0 8px;font-size:20px}.model{color:var(--muted);font-size:12px;line-height:1.5}.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}.session-search{padding:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.sessions{overflow:auto;padding:10px;flex:1}.session-group{margin:14px 4px 7px;color:#9da199;font-size:11px;font-weight:700}.session{width:100%;text-align:left;border:1px solid transparent;border-radius:8px;padding:11px 12px;margin-bottom:7px;background:transparent}.session:hover{background:rgba(255,255,255,.62)}.session.active{background:#fffdf8;border-color:#d4cbbd;box-shadow:0 8px 24px rgba(45,38,26,.06)}.session-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.session-meta{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.main{min-width:0;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(180deg,#fffdf8 0,#f8f6f1 100%)}.topbar{min-height:64px;display:flex;gap:10px;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line);background:rgba(255,253,248,.86)}.topbar strong{font-size:19px}.topbar .spacer{flex:1}.status{color:var(--muted);font-size:12px;min-width:90px}.status.ok{color:var(--ok)}
.chat{overflow:auto;padding:34px min(7vw,92px);display:flex;flex-direction:column;gap:18px}.empty{margin:auto;max-width:620px;color:var(--muted);text-align:center;line-height:1.85;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:34px 38px}.msg{display:flex;flex-direction:column;gap:7px;max-width:min(860px,88%)}.msg.user{align-self:flex-end;max-width:min(720px,78%)}.msg.assistant,.msg.error{align-self:flex-start}.msg.assistant{position:relative;padding-left:18px}.msg.assistant:before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:999px;background:var(--green);box-shadow:0 0 0 4px #e4f1ed}.bubble{padding:14px 16px;border-radius:8px;line-height:1.78;word-break:break-word}.assistant .bubble{background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 30px rgba(45,38,26,.06)}.user .bubble{background:var(--green);color:#fff}.error .bubble{background:#fff7ed;color:var(--danger);border:1px solid #fed7aa}.bubble p{margin:.35em 0}.bubble pre{overflow-x:auto;background:#1d241f;color:#edf3ef;padding:12px;border-radius:8px}.msg-actions{display:flex;gap:6px;opacity:0;transition:opacity .15s}.msg:hover .msg-actions{opacity:.82}.msg.user .msg-actions{justify-content:flex-end}.msg-actions button{min-height:27px;font-size:12px;padding:3px 8px;background:rgba(255,253,248,.84)}
.composer-wrap{border-top:1px solid var(--line);background:rgba(255,253,248,.92);box-shadow:0 -12px 30px rgba(45,38,26,.05)}.composer{padding:16px 28px;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:end}.composer textarea{min-height:48px;max-height:170px;resize:none;line-height:1.55;background:#fff}
.inspector{height:100dvh;overflow:auto;background:#fbfaf6;border-left:1px solid var(--line);padding:18px 16px}.inspector-title{margin:0 0 14px;font-size:15px;color:var(--muted);font-weight:700}.settings,.memory{display:grid;gap:12px}.settings{margin-bottom:18px}.memory{padding-top:18px;border-top:1px solid var(--line)}#pinnedPrompt{min-height:132px;resize:vertical;line-height:1.55}.hidden{display:none}.check-line{grid-template-columns:auto 1fr;align-items:center;color:var(--ink);font-size:13px}.check-line input{width:auto;margin:0}
@media(max-width:1180px){body{grid-template-columns:280px minmax(420px,1fr)}.inspector{display:none}}@media(max-width:820px){body{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:12px 14px;gap:7px}.topbar strong{flex:1 1 140px;white-space:nowrap}.topbar .status{display:none}.topbar button{min-width:48px;padding:7px 9px}.chat{padding:22px}.composer{grid-template-columns:1fr}.msg,.msg.user{max-width:96%}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><h1>DeepSeek Chat</h1><div class="model" data-testid="model-label">模型：deepseek-v4-flash，本地代理，默认提示词注入</div></div>
  <div class="side-actions"><button data-testid="new-session" onclick="newSession()">新建</button><button onclick="renameSession()">重命名</button><button onclick="deleteSession()" class="danger">删除</button><button onclick="clearSession()">清空</button></div>
  <div class="session-search"><input id="sessionSearch" data-testid="session-search" placeholder="搜索会话" oninput="renderSessions()"></div>
  <div id="sessions" class="sessions"></div>
</aside>
<main class="main">
  <div class="topbar"><strong id="activeTitle">新聊天</strong><span id="contextInfo" class="status"></span><span class="spacer"></span><button onclick="toggleInspector()">设置</button><button onclick="exportSession()">导出</button><button onclick="document.getElementById('importFile').click()">导入</button><input id="importFile" class="hidden" type="file" accept="application/json" onchange="importSessionFile(this.files[0]);this.value=''"></div>
  <section id="chat" class="chat"></section>
  <section class="composer-wrap"><div class="composer"><textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea><button id="stopBtn" onclick="stopGeneration()" disabled>停止</button><button id="sendBtn" class="primary" onclick="sendMessage()">发送</button></div></section>
</main>
<aside class="inspector">
  <h2 class="inspector-title">设置</h2>
  <section class="settings">
    <label>项目 ID<input id="userId" maxlength="512" placeholder="可选"></label>
    <label>推理深度<select id="reasoningEffort"><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="max">max</option></select></label>
    <label>温度<input id="temperature" type="number" min="0" max="2" step="0.05"></label>
    <label>top_p<input id="topP" type="number" min="0" max="1" step="0.01"></label>
    <label>输出 tokens<input id="maxTokens" type="number" min="512" max="384000" step="512"></label>
    <button data-testid="save-settings" class="primary" onclick="saveSettingsFromForm()">保存参数</button>
    <span id="settingsStatus" class="status">参数已载入</span>
    <span id="defaultPromptStatus" class="status">默认提示词检测中</span>
  </section>
  <section class="memory">
    <label>置顶补充设定<textarea id="pinnedPrompt" rows="2" placeholder="这里是临时补充设定，会和默认提示词一起发送"></textarea></label>
    <label>上下文条数<input id="contextLimit" data-testid="context-limit" type="number" min="2" max="80" step="2"></label>
    <label>保留最近<input id="recentLimit" type="number" min="2" max="40" step="2"></label>
    <label>上下文预算 tokens<input id="contextTokens" type="number" min="4000" max="200000" step="1000"></label>
    <label class="check-line">发送前自动压缩<input id="autoCompact" type="checkbox" checked></label>
    <button onclick="saveSettingsFromForm()">保存记忆</button>
    <button onclick="summarizeContext()">压缩上下文</button>
  </section>
</aside>
<script>
const API_URL="/api/chat",MODEL="deepseek-v4-flash",SETTINGS_KEY="deepseek_writer_settings_v4",SESSIONS_KEY="deepseek_writer_sessions_v4",ACTIVE_KEY="deepseek_writer_active_session_v4",UI_KEY="deepseek_writer_ui_v1";
const defaults={userId:"",reasoningEffort:"high",temperature:1,topP:.95,maxTokens:8192,contextLimit:24,recentLimit:12,pinnedPrompt:"",contextTokens:26000,autoCompact:false};
let settings={...defaults,...loadJson(SETTINGS_KEY,{})},sessions=migrateSessions(loadJson(SESSIONS_KEY,null)),activeSessionId=localStorage.getItem(ACTIVE_KEY)||sessions[0].id,uiState={inspectorCollapsed:false,...loadJson(UI_KEY,{})},controller=null,isStreaming=false,storageReady=false,lastPersistPromise=Promise.resolve();if(!("autoCompact"in settings))settings.autoCompact=false;
const RENDER_WINDOW=40,MAX_SESSION_MESSAGES=160,MAX_MESSAGE_CHARS=30000;let persistTimer=null,streamRenderTimer=null,sessionRenderTimer=null,lastSessionSignature="",extraVisibleMessages=0,dbPromise=null;const mdCache=new WeakMap(),dirtySessions=new Set(sessions.map(s=>s.id));
const el=id=>document.getElementById(id),activeSession=()=>sessions.find(s=>s.id===activeSessionId)||sessions[0];
function loadJson(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}
function sessionKey(id){return `${SESSIONS_KEY}:session:${id}`}
function openDb(){if(!("indexedDB"in window))return Promise.resolve(null);if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open("deepseek_writer_chat_db",1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains("sessions"))db.createObjectStore("sessions",{keyPath:"id"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}
async function idbGetAll(){const db=await openDb();if(!db)return[];return new Promise((resolve,reject)=>{const req=db.transaction("sessions","readonly").objectStore("sessions").getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)})}
async function idbPutSessions(items){const db=await openDb();if(!db||!items.length)return;await new Promise((resolve,reject)=>{const tx=db.transaction("sessions","readwrite"),store=tx.objectStore("sessions");for(const s of items)store.put(s);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function idbDeleteSession(id){const db=await openDb();if(!db)return;await new Promise((resolve,reject)=>{const req=db.transaction("sessions","readwrite").objectStore("sessions").delete(id);req.onsuccess=resolve;req.onerror=()=>reject(req.error)})}
async function idbClearSessions(){const db=await openDb();if(!db)return;await new Promise((resolve,reject)=>{const req=db.transaction("sessions","readwrite").objectStore("sessions").clear();req.onsuccess=resolve;req.onerror=()=>reject(req.error)})}
function sessionIndex(items){return items.map(s=>({id:s.id,title:s.title,summary:s.summary||"",createdAt:s.createdAt,updatedAt:s.updatedAt,messageCount:s.messages.length,searchText:sessionSearchText(s).slice(0,800)}))}
function loadSplitSessions(index){if(!Array.isArray(index)||!index.length)return null;const loaded=index.map(meta=>{const full=loadJson(sessionKey(meta.id),null);return full?{summary:"",...full}:{...meta,messages:[]}}).filter(Boolean);return loaded.length?loaded:null}
function migrateSessions(v){const split=loadSplitSessions(v);if(split)return split;if(Array.isArray(v)&&v.length)return v.map(s=>({summary:"",...s}));for(const k of["deepseek_writer_sessions_v3","deepseek_writer_sessions_v2"]){const old=loadJson(k,null);if(Array.isArray(old)&&old.length)return old.map(s=>({summary:"",...s}))}return[createSession("新聊天")]}
async function initializeStorage(){try{const stored=await idbGetAll();if(stored.length){const order=new Map((loadJson(SESSIONS_KEY,[])||[]).map((s,i)=>[s.id,i]));sessions=stored.map(s=>({summary:"",...s,messages:Array.isArray(s.messages)?s.messages:[]})).sort((a,b)=>(order.get(a.id)??999999)-(order.get(b.id)??999999)||new Date(b.updatedAt||0)-new Date(a.updatedAt||0));activeSessionId=localStorage.getItem(ACTIVE_KEY)||sessions[0].id}else if(sessions.length){dirtySessions.clear();for(const s of sessions)dirtySessions.add(s.id);persist();await lastPersistPromise}for(const s of sessions)localStorage.removeItem(sessionKey(s.id));storageReady=true;renderAll()}catch(e){console.warn("IndexedDB 初始化失败，已回退到 localStorage 索引",e);storageReady=true;renderAll()}}
function trimForStorage(){for(const s of sessions){if(s.messages.length>MAX_SESSION_MESSAGES)s.messages=s.messages.slice(-MAX_SESSION_MESSAGES);for(const m of s.messages){if(typeof m.content==="string"&&m.content.length>MAX_MESSAGE_CHARS)m.content=m.content.slice(0,MAX_MESSAGE_CHARS)+"\n\n[内容过长，已为前端稳定性截断保存]"}}}
function markDirty(s=activeSession()){if(s)dirtySessions.add(s.id)}
function persist(){try{trimForStorage();const dirty=[...dirtySessions].map(id=>sessions.find(x=>x.id===id)).filter(Boolean);localStorage.setItem(SESSIONS_KEY,JSON.stringify(sessionIndex(sessions)));localStorage.setItem(ACTIVE_KEY,activeSessionId);dirtySessions.clear();lastPersistPromise=idbPutSessions(dirty).catch(e=>console.warn("IndexedDB 保存失败",e))}catch(e){console.warn("会话索引存储失败，已尝试压缩保存",e);for(const s of sessions){s.messages=s.messages.slice(-80);if(s.summary&&s.summary.length>5000)s.summary=s.summary.slice(-5000)}localStorage.setItem(SESSIONS_KEY,JSON.stringify(sessionIndex(sessions)));localStorage.setItem(ACTIVE_KEY,activeSessionId);dirtySessions.clear();lastPersistPromise=idbPutSessions(sessions).catch(err=>console.warn("IndexedDB 保存失败",err))}}
function schedulePersist(){clearTimeout(persistTimer);persistTimer=setTimeout(()=>{if("requestIdleCallback"in window)requestIdleCallback(persist,{timeout:1000});else persist()},500)}
function createSession(title){const now=new Date().toISOString();return{id:crypto.randomUUID(),title,messages:[],summary:"",createdAt:now,updatedAt:now}}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}
function clamp(n,min,max,f){const v=Number(n);return Number.isFinite(v)?Math.max(min,Math.min(max,v)):f}
function saveSettingsFromForm(){settings={userId:el("userId").value.trim(),reasoningEffort:el("reasoningEffort").value,temperature:clamp(el("temperature").value,0,2,defaults.temperature),topP:clamp(el("topP").value,0,1,defaults.topP),maxTokens:Math.round(clamp(el("maxTokens").value,512,384000,defaults.maxTokens)),contextLimit:Math.round(clamp(el("contextLimit").value,2,80,defaults.contextLimit)),recentLimit:Math.round(clamp(el("recentLimit").value,2,40,defaults.recentLimit)),contextTokens:Math.round(clamp(el("contextTokens").value,4000,200000,defaults.contextTokens)),autoCompact:el("autoCompact").checked,pinnedPrompt:el("pinnedPrompt").value.trim()};saveSettings();fillSettings();setStatus("参数和记忆已保存，会用于下一次请求",true);renderAll()}
function fillSettings(){el("userId").value=settings.userId||"";el("reasoningEffort").value=settings.reasoningEffort;el("temperature").value=settings.temperature;el("topP").value=settings.topP;el("maxTokens").value=settings.maxTokens;el("contextLimit").value=settings.contextLimit;el("recentLimit").value=settings.recentLimit;el("contextTokens").value=settings.contextTokens;el("autoCompact").checked=!!settings.autoCompact;el("pinnedPrompt").value=settings.pinnedPrompt||""}
function setStatus(t,ok=false){el("settingsStatus").textContent=t;el("settingsStatus").className=ok?"status ok":"status"}
async function loadProxyStatus(){try{const r=await fetch("/api/status");if(!r.ok)return;const s=await r.json(),i=s.defaultSystemPrompt;el("defaultPromptStatus").textContent=i.enabled?`默认提示词已注入：${i.chars} 字符`:"未配置默认提示词";el("defaultPromptStatus").className=i.enabled?"status ok":"status"}catch{el("defaultPromptStatus").textContent="使用本地服务时显示默认提示词状态"}}
function estimateTokens(t){if(!t)return 0;let cjk=0,ascii=0;for(const ch of String(t)){const c=ch.charCodeAt(0);if(c>0x2e7f)cjk++;else if(c>0x20)ascii++}return Math.ceil(cjk)+Math.ceil(ascii/3.5)}
function fmtK(n){return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,"")+"k":String(n)}
function contextTokens(s){return buildContextMessages(s).reduce((a,m)=>a+estimateTokens(m.content),0)}
function contextCount(s){const usable=s.messages.filter(m=>(m.role==="user"||m.role==="assistant")&&m.content.trim()).length,base=Math.min(settings.contextLimit,usable);return base+(settings.pinnedPrompt||s.summary?1:0)}
function renderAll(){if(!activeSession())activeSessionId=sessions[0].id;scheduleRenderSessions();renderMessages();const s=activeSession();el("activeTitle").textContent=s.title;el("contextInfo").textContent=`${s.messages.length} 条消息，发送 ${contextCount(s)} 条上下文 · 约 ${fmtK(contextTokens(s))} tokens`;schedulePersist()}
function sessionSearchText(s){if(!s.searchText||s.searchVersion!==s.messages.length){s.searchText=(s.title+" "+s.messages.slice(-20).map(m=>m.content).join(" ")).toLowerCase();s.searchVersion=s.messages.length}return s.searchText}
function scheduleRenderSessions(){clearTimeout(sessionRenderTimer);sessionRenderTimer=setTimeout(renderSessions,40)}
function renderSessions(){const q=(el("sessionSearch")?.value||"").trim().toLowerCase(),signature=sessions.map(s=>`${s.id}:${s.title}:${s.messages.length}:${s.updatedAt}`).join("|")+"|"+activeSessionId+"|"+q;if(signature===lastSessionSignature)return;lastSessionSignature=signature;const shown=sessions.filter(s=>!q||sessionSearchText(s).includes(q));if(!shown.length){el("sessions").innerHTML=`<div class="empty">没有匹配的会话</div>`;return}el("sessions").innerHTML=groupSessions(shown).map(g=>`<div class="session-group">${g.label}</div>${g.items.map(s=>`<button class="session ${s.id===activeSessionId?"active":""}" onclick="switchSession('${s.id}')"><span class="session-title">${escapeHtml(s.title)}</span><span class="session-meta">${s.messages.length} 条消息 · ${formatTime(s.updatedAt)}</span></button>`).join("")}`).join("")}
function visibleMessages(s){const size=Math.min(s.messages.length,RENDER_WINDOW+extraVisibleMessages),start=Math.max(0,s.messages.length-size);return{start,items:s.messages.slice(start)}}
function renderMessages(){const s=activeSession();if(!s.messages.length&&!s.summary){el("chat").innerHTML=`<div class="empty">这个会话还没有内容。你的默认提示词会由本地 Node 服务自动注入；这里的置顶补充设定会作为额外上下文发送。</div>`;return}const win=visibleMessages(s),hidden=s.messages.length-win.items.length,notice=hidden?`<div class="empty">已隐藏较早的 ${hidden} 条消息以保持页面流畅。<br><button onclick="showOlderMessages()">显示更早 20 条</button></div>`:"",sum=s.summary?`<div class="msg assistant"><div class="bubble"><strong>上下文摘要</strong><br>${escapeHtml(s.summary)}</div></div>`:"";el("chat").innerHTML=notice+sum+win.items.map((m,offset)=>messageHtml(m,win.start+offset)).join("");el("chat").scrollTop=el("chat").scrollHeight}
function renderMarkdown(m){if(!window.marked)return escapeHtml(m.content||"正在生成...");const cached=mdCache.get(m);if(cached&&cached.source===m.content)return cached.html;const html=marked.parse(m.content||"正在生成...",{breaks:true,gfm:true});mdCache.set(m,{source:m.content,html});return html}
function messageHtml(m,i){const role=m.role==="assistant"?"assistant":m.role==="error"?"error":"user",content=role==="assistant"?renderMarkdown(m):escapeHtml(m.content);return`<div class="msg ${role}" data-msg-index="${i}"><div class="bubble">${content}</div><div class="msg-actions"><button onclick="copyMessage(${i})">复制</button><button onclick="editMessage(${i})">编辑</button><button onclick="deleteMessage(${i})">删除</button>${role==="assistant"?`<button onclick="regenerateFrom(${i})">重发</button>`:""}</div></div>`}
function buildContextMessages(s){const msgs=s.messages.filter(m=>(m.role==="user"||m.role==="assistant")&&m.content.trim()),limit=Math.min(settings.contextLimit,msgs.length),recentN=Math.min(settings.recentLimit,limit),recent=msgs.slice(-recentN),olderCount=Math.max(0,limit-recentN),older=olderCount?msgs.slice(-limit,-recentN):[],result=[];const parts=[settings.pinnedPrompt,s.summary?`历史摘要：\n${s.summary}`:""].filter(Boolean);if(parts.length)result.push({role:"system",content:parts.join("\n\n")});if(older.length)result.push({role:"system",content:`以下是较早上下文的简要保留（已省略部分细节）：\n${older.map(m=>`${m.role}: ${m.content}`).join("\n").slice(0,4000)}`});return result.concat(recent.map(({role,content})=>({role,content})))}
function buildRequestBody(s){const body={model:MODEL,messages:buildContextMessages(s),stream:true,temperature:settings.temperature,top_p:settings.topP,max_tokens:settings.maxTokens,reasoning_effort:settings.reasoningEffort};if(settings.userId)body.user=settings.userId;return body}
async function sendMessage(){const text=el("input").value.trim();if(!text||isStreaming)return;saveSettingsFromForm();const s=activeSession();if(s.title==="新聊天")s.title=text.slice(0,28);s.messages.push({role:"user",content:text,createdAt:new Date().toISOString()});markDirty(s);await requestAssistant(s)}
async function requestAssistant(s){s.messages.push({role:"assistant",content:"",createdAt:new Date().toISOString()});s.updatedAt=new Date().toISOString();markDirty(s);el("input").value="";setBusy(true);renderAll();try{if(settings.autoCompact&&contextTokens(s)>settings.contextTokens){const old=s.messages.slice(0,-settings.recentLimit);if(old.length){setStatus("正在压缩上下文…",false);const summary=await summarizeRemote(old,s.summary);if(summary){s.summary=summary.slice(0,10000);s.messages=s.messages.slice(-settings.recentLimit);s.updatedAt=new Date().toISOString();markDirty(s);setStatus("旧上下文已压缩为摘要",true)}else{setStatus("自动压缩服务不可用，按未压缩发送",false)}}}controller=new AbortController();const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(buildRequestBody(s)),signal:controller.signal});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||`请求失败：${r.status} ${r.statusText}`)}await readStream(r.body.getReader(),chunk=>{s.messages[s.messages.length-1].content+=chunk;s.updatedAt=new Date().toISOString();markDirty(s);schedulePersist();scheduleStreamRender()})}catch(e){const last=s.messages[s.messages.length-1];if(!last.content)s.messages.pop();s.messages.push({role:"error",content:e.name==="AbortError"?"生成已停止":e.message,createdAt:new Date().toISOString()});markDirty(s);renderAll()}finally{setBusy(false);controller=null;clearTimeout(streamRenderTimer);renderMessages();persist()}}
function updateLastAssistantBubble(){const s=activeSession(),i=s.messages.length-1,m=s.messages[i],node=document.querySelector(`.msg[data-msg-index="${i}"] .bubble`);if(!node||!m||m.role!=="assistant")return renderMessages();node.innerHTML=renderMarkdown(m);el("chat").scrollTop=el("chat").scrollHeight}
function scheduleStreamRender(){if(streamRenderTimer)return;streamRenderTimer=setTimeout(()=>{streamRenderTimer=null;updateLastAssistantBubble()},80)}
async function readStream(reader,onChunk){const decoder=new TextDecoder();let buffer="";while(true){const{done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split("\n");buffer=lines.pop()||"";for(const line of lines){const t=line.trim();if(!t.startsWith("data:"))continue;const data=t.slice(5).trim();if(data==="[DONE]")return;try{const d=JSON.parse(data).choices?.[0]?.delta?.content;if(d)onChunk(d)}catch{}}}}

function copyMessage(i){navigator.clipboard?.writeText(activeSession().messages[i].content)}function editMessage(i){const s=activeSession(),n=prompt("编辑消息",s.messages[i].content);if(n!==null){s.messages[i].content=n;s.updatedAt=new Date().toISOString();markDirty(s);renderAll()}}function deleteMessage(i){const s=activeSession();s.messages.splice(i,1);markDirty(s);renderAll()}function regenerateFrom(i){const s=activeSession();s.messages=s.messages.slice(0,i);markDirty(s);requestAssistant(s)}
async function summarizeContext(){const s=activeSession(),old=s.messages.slice(0,-settings.recentLimit);if(!old.length)return setStatus("没有需要压缩的旧上下文");setStatus("正在压缩上下文…",false);const summary=await summarizeRemote(old,s.summary);if(summary){s.summary=summary.slice(0,10000);s.messages=s.messages.slice(-settings.recentLimit);s.updatedAt=new Date().toISOString();markDirty(s);setStatus("旧上下文已压缩为摘要",true);renderAll();return}s.summary=old.map(m=>`${m.role}: ${m.content}`).join("\n").slice(-5000);s.messages=s.messages.slice(-settings.recentLimit);s.updatedAt=new Date().toISOString();markDirty(s);setStatus("摘要服务不可用，已用本地截断保存",false);renderAll()}
async function summarizeRemote(messages,existingSummary){try{const r=await fetch("/api/summarize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages,summary:existingSummary||undefined})});if(!r.ok)return null;const d=await r.json();return typeof d.summary==="string"&&d.summary.trim()?d.summary.trim():null}catch{return null}}
function stopGeneration(){if(controller)controller.abort()}function setBusy(b){isStreaming=b;el("sendBtn").disabled=b;el("stopBtn").disabled=!b}function toggleInspector(){uiState.inspectorCollapsed=!uiState.inspectorCollapsed;localStorage.setItem(UI_KEY,JSON.stringify(uiState));applyUiState()}function applyUiState(){document.body.classList.toggle("inspector-collapsed",!!uiState.inspectorCollapsed)}
function groupSessions(items){const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),yesterday=today-86400000,groups=[{label:"今天",items:[]},{label:"昨天",items:[]},{label:"更早",items:[]}];for(const item of items){const time=new Date(item.updatedAt||item.createdAt||0).getTime();if(time>=today)groups[0].items.push(item);else if(time>=yesterday)groups[1].items.push(item);else groups[2].items.push(item)}return groups.filter(g=>g.items.length)}
function exportSession(){const s=activeSession(),blob=new Blob([JSON.stringify({model:MODEL,settings,session:s},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`deepseek-${s.title||"session"}-${Date.now()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)}
async function importSessionFile(file){if(!file)return;try{const data=JSON.parse(await file.text()),imported=data.session||data;if(!Array.isArray(imported.messages))throw new Error("JSON 中没有 session.messages");sessions.unshift({summary:"",...imported,id:crypto.randomUUID(),updatedAt:new Date().toISOString()});activeSessionId=sessions[0].id;renderAll()}catch(e){activeSession().messages.push({role:"error",content:"导入失败："+e.message,createdAt:new Date().toISOString()});renderAll()}}
function escapeHtml(t){const d=document.createElement("div");d.textContent=t||"";return d.innerHTML}function formatTime(v){return v?new Date(v).toLocaleString():""}
el("input").addEventListener("input",()=>{el("input").style.height="auto";el("input").style.height=Math.min(el("input").scrollHeight,170)+"px"});el("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
